###############################################
#  Core networking + OpenThread
###############################################
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_OPENTHREAD=y

CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_MULTITHREADING=y


###############################################
#  Console + Shell
###############################################
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=2048


###############################################
#  Logging
###############################################
CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_LOG_MODE_IMMEDIATE=y

# Voorkom dubbele log-threads die stack vreten
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=32


###############################################
#  I2C + Sensordrivers
###############################################
CONFIG_I2C=y
CONFIG_SENSOR=y

# Sensor driver logging
CONFIG_SENSOR_LOG_LEVEL_INF=y


###############################################
#  Memory & Thread stacks (belangrijk!)
###############################################
# App / main / workqueue
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=3072
CONFIG_HEAP_MEM_POOL_SIZE=8192

# OpenThread thread stacks
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=8192
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=1024

# Stack debugging / guards
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# Fault debugging
CONFIG_FAULT_DUMP=2
CONFIG_ASSERT=y


###############################################
#  CoAP Transport
###############################################
CONFIG_COAP=y
CONFIG_APP_TRANSPORT_COAP=y
CONFIG_APP_COAP_ACK_TIMEOUT_MS=800
CONFIG_APP_COAP_RETRIES=3


###############################################
#  Settings (persist CoAP server)
###############################################
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# NVS requires flash + map + nvs backend
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
