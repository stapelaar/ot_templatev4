# Node-identiteit
CONFIG_APP_NODE_ID="61"

# Cadence
CONFIG_APP_MEASUREMENT_PERIOD_S=60

# Thread rol
CONFIG_OPENTHREAD_MTD=y
# of:
# CONFIG_OPENTHREAD_FTD=y

# Features
CONFIG_APP_PUBLISH_UPTIME=y
CONFIG_APP_DEBUG_SENSOR=y

# Sensor-keuze
CONFIG_APP_USE_SHT41_SENSOR=n
CONFIG_APP_USE_SCD41_SENSOR=y

# Driver (zet 'm per node aan; simpel en duidelijk)
CONFIG_SCD4X=y


